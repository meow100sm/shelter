{% extends 'base_no_menu.html' %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 40px auto;">
    <div class="card">
        <div class="card-header bg-info text-white" style="padding: 12px 20px;">
            <h3 class="mb-0">Настройка двухфакторной аутентификации</h3>
        </div>
        <div class="card-body" style="text-align: center;">
            <p>Отсканируйте этот QR-код вашим приложением-аутентификатором<br>(например, Google Authenticator или Яндекс Ключ).</p>
            <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR Code" style="margin-bottom: 20px;">
            <form method="post">
                {% csrf_token %}
                <div class="field mb-4">
                    <label for="token">Код из приложения:</label>
                    <input type="text" name="token" id="token" class="form-control" placeholder="000000" required>
                </div>
                <button type="submit" class="btn btn-success">Подтвердить и включить 2FA</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
